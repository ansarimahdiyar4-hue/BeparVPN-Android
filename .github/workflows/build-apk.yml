name: Build Bepar VPN Android APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'BeparVPN-Android-NEW.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/BeparVPN-Android-NEW.zip"
          test -s "$ZIP_FILE" || { echo 'BeparVPN-Android-NEW.zip was not found in the repository root.'; exit 1; }
          unzip -tq "$ZIP_FILE"
          EXTRACT_DIR="$RUNNER_TEMP/bepar-project"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"
          SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS_FILE" || { echo 'Gradle settings file was not found inside the ZIP.'; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo 'Android app module was not found.'; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project extracted to: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go 1.27.3 for libXray
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK" || { echo "Android SDK not found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install Android platform, build tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 50); do printf 'y\n'; done | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify extracted project
        shell: bash
        run: python3 "$PROJECT_DIR/scripts/verify_project.py"

      - name: Build official XTLS libXray Android AAR
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v26.10.31 https://github.com/XTLS/libXray.git "$RUNNER_TEMP/libXray"
          cd "$RUNNER_TEMP/libXray"
          python3 build/main.py android
          test -s libXray.aar
          mkdir -p "$PROJECT_DIR/app/libs"
          cp libXray.aar "$PROJECT_DIR/app/libs/libXray.aar"

      - name: Patch Kotlin Compose imports
        shell: bash
        run: |
          set -euo pipefail
          FILE="$PROJECT_DIR/app/src/main/java/com/bepar/vpn/MainActivity.kt"
          test -f "$FILE" || { echo "MainActivity.kt not found: $FILE"; exit 1; }
          python3 - "$FILE" <<'PYCODE'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          # `weight` is a RowScope/ColumnScope member; importing the internal
          # implementation exposes an inaccessible RowColumnParentData API.
          s = s.replace("import androidx.compose.foundation.layout.weight\n", "")
          # safeDrawing is a separate WindowInsets extension property import.
          if "import androidx.compose.foundation.layout.safeDrawing\n" not in s:
              s = s.replace(
                  "import androidx.compose.foundation.layout.WindowInsets\n",
                  "import androidx.compose.foundation.layout.WindowInsets\nimport androidx.compose.foundation.layout.safeDrawing\n"
              )
          p.write_text(s, encoding="utf-8")
          print("Patched Compose imports in", p)
          PYCODE

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build, test and lint debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bepar-vpn-android-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
