name: Build BeparVPN Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q BeparVPN-Android-NEW.zip -d project

      - name: Find Android Project
        run: |
          FILE=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeparVPN-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
